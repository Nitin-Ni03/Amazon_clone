<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="logo">
        <img src="amazon-logo-transparent.png" >
    </div>
    

    <main id="login-form">
        <h1>Create Account</h1>

        <label> Your Name</label>
        <input type="text" placeholder="First and last name" required></div>

        <label>Email</label>
        <input type="email" required></div>

        <label>Password</label>
        <input type="password" minlength="8" required></div>

        <p class="info">ℹ Password must be at least 8 character</p>

        <label>Re-Enter Password</label>
        <input type="password" minlength="8" required></div>

        <button class="button">Create your Amazon account</button>

        <p class="terms">
            By Creating an account, you agree to 
            <a href="#">Amazon's Site Terms</a> and 
            <a href="#">Privacy Notice</a>
        </p>

        <hr>

        <p  class="sign-in">
            Already have an account? 
            <a href="#">Sign in ></a>
        </p>

    </main>

        <div id="footer">
            <a href="#">Site Terms</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>

        <div class="copy-right">
            <p>© 1996-2026 Amazon.com, inc. or its affiliates. All rights reserved.</p>
        </div>
</body>
</html>
